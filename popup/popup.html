<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Switcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div id="app">

    <!-- ── HEADER ─────────────────────────────────────────────── -->
    <header id="popup-header">
      <div class="header-left">
        <img class="logo-mark" src="../icons/icon48.png" alt="Logo" />
        <div class="header-titles">
          <span class="header-title">Profile Switcher</span>
          <span class="header-subtitle">profile-switcher</span>
        </div>
      </div>
      <span id="current-domain" class="domain-badge">memuat…</span>
    </header>

    <!-- ── SAVE SECTION ───────────────────────────────────────── -->
    <section id="save-section">
      <div class="save-row">
        <input
          type="text"
          id="session-name-input"
          class="input-field"
          placeholder="Nama session baru…"
          maxlength="40"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="btn-save" class="btn-save">+ Save</button>
      </div>
      <div class="action-row">
        <button id="btn-clear-cookies" class="btn-clear-cookies">Log Out</button>
      </div>
    </section>

    <!-- ── MAIN VIEW: grid kartu domain ──────────────────────── -->
    <div id="view-main">
      <div class="list-header">
        <span class="section-label">Saved Sessions</span>
        <span id="session-count" class="session-count">0 sessions</span>
      </div>

      <div id="session-grid-outer" class="session-grid-outer">
        <div id="session-grid">
          <!-- Domain cards di-inject oleh popup.js -->
        </div>
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">🗄️</div>
        <p class="empty-text">
          Belum ada session tersimpan.<br />
          Buka halaman yang ingin disimpan,<br />
          lalu klik <strong>+ Save</strong> di atas.
        </p>
      </div>

    </div>

    <!-- ── DOMAIN DETAIL VIEW ─────────────────────────────────── -->
    <div id="view-domain" style="display: none;">
      <div class="detail-header">
        <button id="btn-back" class="btn-back">← Back</button>
        <div class="detail-site">
          <div id="detail-favicon-wrap" class="detail-favicon-wrap"></div>
          <span id="detail-domain-name" class="detail-domain-name"></span>
        </div>
      </div>
      <div id="detail-session-list" class="detail-session-list">
        <!-- Session items untuk domain ini di-inject oleh popup.js -->
      </div>
    </div>

    <!-- ── FOOTER ─────────────────────────────────────────────── -->
    <footer id="popup-footer">
      <div class="footer-left">
        <div id="status-dot" class="status-dot dot-ready"></div>
        <span id="status-text" class="status-text">Storage ready</span>
      </div>
      <div class="footer-right">
        <button id="btn-manage" class="btn-manage" title="Hapus session">
          <svg width="11" height="13" viewBox="0 0 11 13" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3.5 1.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M1 4h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M2 4l.75 7.5h5.5L9 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span id="storage-warning" class="storage-warning" style="display:none"></span>
        <span id="version-tag" class="version-tag">v1.2.0</span>
      </div>
    </footer>

  </div><!-- /#app -->

  <div id="toast" class="toast toast-hidden" aria-live="polite"></div>

  <script src="popup.js"></script>

</body>
</html>
